server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback: TanStack Router owns the path; any URL that is not a real
  # file or directory falls through to index.html so the client can resolve
  # it. Cache-bust hashed assets aggressively; never cache the HTML shell.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
