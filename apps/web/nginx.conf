server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Compress text payloads. nginx's default `gzip_types` is `text/html` only,
  # which would leave the hashed JS/CSS bundles uncompressed — a ~3× transfer
  # hit on cold loads.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # SPA fallback: TanStack Router owns the path; any URL that is not a real
  # file falls through to index.html so the client can resolve it. Cache-bust
  # hashed assets aggressively; never cache the HTML shell.
  location / {
    try_files $uri /index.html;
  }

  location /assets/ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
