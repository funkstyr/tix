services:
  postgres:
    image: postgres:16-alpine
    container_name: tix-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: tix
      AUTH_PASSWORD: ${AUTH_PASSWORD:-auth_dev}
      TICKETS_PASSWORD: ${TICKETS_PASSWORD:-tickets_dev}
      ORDERS_PASSWORD: ${ORDERS_PASSWORD:-orders_dev}
      EXPIRATION_PASSWORD: ${EXPIRATION_PASSWORD:-expiration_dev}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tix"]
      interval: 2s
      timeout: 3s
      retries: 30

  nats:
    image: nats:2.10-alpine
    container_name: tix-nats
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz"]
      interval: 2s
      timeout: 3s
      retries: 30

  nats-init:
    image: natsio/nats-box:0.18.0
    container_name: tix-nats-init
    depends_on:
      nats:
        condition: service_healthy
    environment:
      NATS_URL: nats://nats:4222
    volumes:
      - ./infra/docker/nats-init.sh:/nats-init.sh:ro
    entrypoint: ["sh", "/nats-init.sh"]
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: tix-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  postgres_data:
  nats_data:
  redis_data:
