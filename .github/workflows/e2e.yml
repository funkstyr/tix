name: E2E

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

# Group by the source branch on workflow_run, or the dispatched ref otherwise.
# On workflow_run, github.ref points at the workflow file (typically main), not
# the PR branch — head_branch is the only handle on the originating branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.ref }}
  cancel-in-progress: ${{ github.event.workflow_run.event == 'pull_request' }}

jobs:
  e2e:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      # `--wait` treats the one-shot nats-init container's clean exit(0) as a
      # failure (this killed the only previous run of this workflow), so wait
      # only on the long-running services, then run the stream bootstrap to
      # completion so a failure there still fails the job.
      - name: Bring up infra (postgres, nats, redis)
        run: |
          docker compose up -d --wait postgres nats redis
          docker compose run --rm nats-init

      - name: Run e2e smoke test
        run: pnpm run e2e

      - name: Tear down infra
        if: always()
        run: docker compose down -v

  web-e2e:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      # Both keys must come from the same Stripe test mode account: the
      # browser tokenizes a card against the publishable key, and the
      # payments service confirms the resulting PaymentIntent against the
      # secret key. Mixing accounts surfaces as a generic "No such
      # PaymentMethod" from Stripe at confirm time.
      STRIPE_TEST_KEY: ${{ secrets.STRIPE_TEST_KEY }}
      STRIPE_TEST_PUBLISHABLE_KEY: ${{ secrets.STRIPE_TEST_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/cache@v5
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Build workspace packages
        run: pnpm build:packages

      # The harness boots Postgres + NATS via testcontainers itself, so the
      # job doesn't need `docker compose up` — but Playwright needs its
      # bundled browsers installed once.
      - name: Install Playwright browsers
        run: pnpm --filter @tix/web-e2e exec playwright install --with-deps chromium

      - name: Run Playwright Buyer + Seller smoke tests
        run: pnpm --filter @tix/web-e2e test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/web-e2e/playwright-report
          retention-days: 14
