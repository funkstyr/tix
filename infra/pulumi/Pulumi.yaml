name: tix
runtime:
  name: nodejs
  # Pulumi's bundled ts-node@7 can't parse the repo's modern tsconfig
  # (allowImportingTsExtensions, verbatimModuleSyntax, …). Disable it and run
  # the `.ts` entrypoint through Node's native type stripping (Node >= 22.18).
  options:
    typescript: false
description: Pulumi program (TypeScript) for the tix services. Will manage Kubernetes manifests once wired up — see ADR-0006.
